# Nome do workflow que aparecerá na aba Actions do GitHub
name: CI

# Define quando o workflow será executado
on:
  # Executa automaticamente quando alguém fizer um push
  push:

  # Executa automaticamente quando houver atividade em um Pull Request
  pull_request:

# Define as permissões do workflow
permissions:
  # Permite apenas ler o conteúdo do repositório
  contents: read

# Define os trabalhos que serão executados
jobs:

  # Nome do trabalho (job)
  build:

    # O GitHub disponibiliza uma máquina virtual com Ubuntu
    runs-on: ubuntu-latest

    # Lista de etapas executadas em sequência
    steps:

      # Baixa o código do repositório para a máquina virtual
      - name: Checkout do código
        uses: actions/checkout@v7

      # Instala e configura o Java 17
      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          # Utiliza a distribuição Eclipse Temurin do Java
          distribution: temurin

          # Define a versão do Java
          java-version: '17'

          # Armazena dependências Maven em cache
          # para acelerar as próximas execuções
          cache: maven

      # Compila o projeto e executa os testes automatizados
      - name: Executar build e testes
        run: mvn -B clean verify
